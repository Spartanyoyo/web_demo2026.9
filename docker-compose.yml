services:
  db:
    image: postgres:16-alpine
    container_name: pointdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pointledger
      POSTGRES_PASSWORD: pointledger_dev
      POSTGRES_DB: pointledger
    ports:
      - "5432:5432"
    volumes:
      - pointdesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pointledger -d pointledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pointdesk_pgdata:
